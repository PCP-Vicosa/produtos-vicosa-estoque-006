<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Depósito 006</title>
<script src="./vendor/plotly.min.js"></script>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --series-6: #008300; /* green */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
      --good:     #0ca30c;
      --warning:  #fab219;
      --serious:  #ec835a;
      --critical: #d03b3b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .subtitle { color: var(--text-secondary); font-size: 13px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  select, input[type="text"] {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--baseline);
    background: var(--surface-1);
    color: var(--text-primary);
    min-width: 220px;
  }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .stat-tile {
    flex: 1 1 160px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-tile .value { font-size: 24px; font-weight: 600; }
  .stat-tile .delta { font-size: 13px; margin-top: 4px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--critical); }
  .delta.flat { color: var(--text-muted); }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--text-primary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline); }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 20%, transparent); color: #8a5c00; }
  .badge.critical { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .footer-note { color: var(--text-muted); font-size: 12px; margin-top: 24px; text-align: center; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
  #chart { width: 100%; height: 420px; }
  @media (prefers-color-scheme: dark) {
    .badge.warning { color: #ffd873; }
  }
</style>
</head>
<body>
<div class="viz-root wrap">
  <header class="top">
    <div>
      <h1>Estoque — Depósito 006</h1>
      <div class="subtitle" id="geradoEm"></div>
    </div>
  </header>

  <div class="card filters">
    <div class="filter-group">
      <label for="filtroFamilia">Família</label>
      <select id="filtroFamilia"></select>
    </div>
    <div class="filter-group">
      <label for="filtroProduto">Produto</label>
      <select id="filtroProduto"></select>
    </div>
    <div class="filter-group">
      <label for="filtroPeriodo">Período</label>
      <select id="filtroPeriodo">
        <option value="7">Última semana</option>
        <option value="30">Último mês</option>
        <option value="all">Tudo</option>
      </select>
    </div>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="card">
    <h2 id="chartTitle">Evolução do saldo</h2>
    <div id="chart"></div>
  </div>

  <div class="card">
    <h2 id="lotesTitle">Lotes em estoque (última leitura)</h2>
    <div id="lotesTable"></div>
  </div>

  <div class="footer-note">Fonte: BD_006.xlsx — Depósito 006</div>
</div>

<script>
const DATA = __DASHBOARD_DATA__;

document.getElementById('geradoEm').textContent = 'Atualizado em ' + DATA.gerado_em;

const seriesColors = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)',
                       'var(--series-5)','var(--series-6)','var(--series-7)','var(--series-8)'];

function resolveVar(name) {
  return getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(name).trim();
}

// --- Monta listas de família / produto ---
const familias = [...new Set(DATA.resumo.map(r => r.familia))].sort();
const familiaSelect = document.getElementById('filtroFamilia');
familiaSelect.innerHTML = '<option value="">Todas</option>' +
  familias.map(f => `<option value="${f}">Família ${f}</option>`).join('');

const produtoSelect = document.getElementById('filtroProduto');

function produtosDaFamilia(familia) {
  return DATA.resumo
    .filter(r => !familia || r.familia === familia)
    .map(r => r.produto)
    .sort();
}

function popularProdutos(familia) {
  const produtos = produtosDaFamilia(familia);
  produtoSelect.innerHTML = produtos.map(p => `<option value="${p}">${p}</option>`).join('');
}

popularProdutos('');

familiaSelect.addEventListener('change', () => {
  popularProdutos(familiaSelect.value);
  render();
});
produtoSelect.addEventListener('change', render);
document.getElementById('filtroPeriodo').addEventListener('change', render);

function formatNum(n) {
  return n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

function statTile(label, value, deltaLabel, deltaClass) {
  return `
    <div class="stat-tile">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      ${deltaLabel ? `<div class="delta ${deltaClass}">${deltaLabel}</div>` : ''}
    </div>`;
}

function badgeParaValidade(dias) {
  if (dias === null || dias === undefined) return '';
  if (dias < 0) return '<span class="badge critical">vencido</span>';
  if (dias <= 7) return `<span class="badge critical">${dias} dia(s)</span>`;
  if (dias <= 20) return `<span class="badge warning">${dias} dias</span>`;
  return `<span class="badge good">${dias} dias</span>`;
}

function render() {
  const produto = produtoSelect.value;
  const periodo = document.getElementById('filtroPeriodo').value;

  // --- Stat row ---
  const info = DATA.resumo.find(r => r.produto === produto);
  const statRow = document.getElementById('statRow');
  if (!info) {
    statRow.innerHTML = '<div class="empty">Selecione um produto.</div>';
  } else {
    const delta = info.variacao;
    const deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
    const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '—';
    statRow.innerHTML =
      statTile('Saldo atual', formatNum(info.saldo_atual), null, '') +
      statTile('Saldo dia anterior', formatNum(info.saldo_anterior), null, '') +
      statTile('Variação (1 dia)', `${arrow} ${formatNum(Math.abs(delta))}`, null, deltaClass) +
      statTile('Família', 'Família ' + info.familia, null, '');
  }

  // --- Gráfico de evolução ---
  document.getElementById('chartTitle').textContent = produto
    ? `Evolução do saldo — ${produto}`
    : 'Evolução do saldo';

  let datas = DATA.evolucao.datas;
  let valores = produto ? (DATA.evolucao.series[produto] || datas.map(() => 0)) : [];

  if (periodo !== 'all') {
    const n = parseInt(periodo, 10);
    datas = datas.slice(-n);
    valores = valores.slice(-n);
  }

  const trace = {
    x: datas,
    y: valores,
    type: 'scatter',
    mode: 'lines+markers',
    line: { color: resolveVar('--series-1'), width: 2, shape: 'spline' },
    marker: { size: 8, color: resolveVar('--series-1') },
    fill: 'tozeroy',
    fillcolor: resolveVar('--series-1').replace(')', ', 0.08)').replace('rgb', 'rgba'),
    hovertemplate: '%{x}<br>Saldo: %{y:,.0f}<extra></extra>',
  };

  const layout = {
    margin: { l: 50, r: 20, t: 10, b: 40 },
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: resolveVar('--text-secondary'), size: 12 },
    xaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') } },
    yaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') }, rangemode: 'tozero' },
    showlegend: false,
  };

  Plotly.newPlot('chart', produto ? [trace] : [], layout, { displayModeBar: false, responsive: true });

  // --- Tabela de lotes ---
  document.getElementById('lotesTitle').textContent =
    `Lotes em estoque — ${DATA.lotes.ultima_data}` + (produto ? ` — ${produto}` : '');

  const lotes = produto ? (DATA.lotes.lotes[produto] || []) : [];
  const tableDiv = document.getElementById('lotesTable');
  if (!produto) {
    tableDiv.innerHTML = '<div class="empty">Selecione um produto para ver os lotes.</div>';
  } else if (lotes.length === 0) {
    tableDiv.innerHTML = '<div class="empty">Sem saldo em estoque na última leitura.</div>';
  } else {
    tableDiv.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Lote</th>
            <th>Fabricação</th>
            <th>Validade</th>
            <th class="num">Saldo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${lotes.map(l => `
            <tr>
              <td>${l.lote}</td>
              <td>${l.fabricacao}</td>
              <td>${l.validade}</td>
              <td class="num">${formatNum(l.saldo)}</td>
              <td>${badgeParaValidade(l.dias_para_vencer)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
}

// Seleciona o primeiro produto por padrão
if (produtoSelect.options.length > 0) {
  produtoSelect.selectedIndex = 0;
}
render();
</script>
</body>
</html>
