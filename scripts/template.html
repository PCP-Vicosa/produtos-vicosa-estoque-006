<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Depósito 006</title>
<script src="./vendor/plotly.min.js"></script>
<style>
  .viz-root {
    color-scheme: light;
    /* Paleta extraída do tema Power BI (Tema.json) */
    --brand:          #1B5E3A;
    --surface-1:      #FFFFFF;
    --page-plane:     #F7F5F0;
    --text-primary:   #2D2D2D;
    --text-secondary: #52514e;
    --text-muted:     #7F898A;
    --gridline:       #E0E0E0;
    --baseline:       #C3C2B7;
    --border:         #E0E0E0;
    --slicer-bg:      #F7F5F0;
    --series-1: #1B5E3A; /* verde (marca) */
    --series-2: #0277BD; /* azul */
    --series-3: #C68642; /* âmbar */
    --series-4: #6B8E23; /* oliva */
    --series-5: #8B5A2B; /* marrom */
    --series-6: #4A90A4; /* teal */
    --series-7: #B8860B; /* dourado */
    --series-8: #7B4F71; /* violeta */
    --good:     #2E7D32;
    --warning:  #C68642;
    --critical: #B00020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; color: var(--brand); font-weight: 600; }
  .subtitle { color: var(--text-secondary); font-size: 12px; }

  nav.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  nav.tabs button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 10px 16px; border: none; background: none; cursor: pointer;
    color: var(--text-secondary); border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; background: var(--slicer-bg); border-radius: 6px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-size: 11px; color: var(--brand); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  select, input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--baseline);
    background: var(--surface-1);
    color: var(--text-primary);
    min-width: 180px;
  }

  /* Multi-select com checkboxes */
  .multiselect { position: relative; min-width: 200px; }
  .multiselect-btn {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--baseline);
    background: var(--surface-1);
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .multiselect-btn:after { content: "▾"; color: var(--text-muted); font-size: 11px; }
  .multiselect-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    z-index: 20;
    max-height: 260px;
    overflow-y: auto;
    padding: 6px 0;
  }
  .multiselect.open .multiselect-panel { display: block; }
  .multiselect-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .multiselect-option:hover { background: var(--slicer-bg); }
  .multiselect-option input { accent-color: var(--brand); cursor: pointer; }
  .multiselect-divider { border-top: 1px solid var(--gridline); margin: 4px 0; }
  .multiselect-action {
    padding: 6px 12px;
    font-size: 12px;
    color: var(--brand);
    cursor: pointer;
    font-weight: 600;
  }
  .multiselect-action:hover { text-decoration: underline; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .stat-tile {
    flex: 1 1 160px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-tile .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .02em; }
  .stat-tile .value { font-size: 28px; font-weight: 600; color: var(--brand); font-family: "Segoe UI Semibold", "Segoe UI", sans-serif; }
  .stat-tile .delta { font-size: 12px; margin-top: 4px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--critical); }
  .delta.flat { color: var(--text-muted); }

  h2 { font-size: 14px; margin: 0 0 12px; color: var(--text-primary); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--gridline); }
  th { color: var(--text-secondary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) { background: #FAFAF8; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: #8a5c00; }
  .badge.critical { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .table-scroll { max-height: 420px; overflow-y: auto; }
  .footer-note { color: var(--text-muted); font-size: 12px; margin-top: 24px; text-align: center; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .chart-tall { width: 100%; height: 380px; }
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>
<div class="viz-root wrap">
  <header class="top">
    <div>
      <h1>Estoque — Depósito 006</h1>
      <div class="subtitle" id="geradoEm"></div>
    </div>
  </header>

  <nav class="tabs">
    <button data-page="geral" class="active">Visão Geral</button>
    <button data-page="familia">Família / SKU</button>
    <button data-page="lotes">Lotes e Validade</button>
  </nav>

  <!-- ===================== PÁGINA 1: VISÃO GERAL ===================== -->
  <section class="page active" id="page-geral">
    <div class="card filters">
      <div class="filter-group">
        <label for="geralPeriodo">Período</label>
        <select id="geralPeriodo">
          <option value="7">Última semana</option>
          <option value="30">Último mês</option>
          <option value="all" selected>Tudo</option>
        </select>
      </div>
    </div>

    <div class="stat-row" id="geralStatRow"></div>

    <div class="grid-2">
      <div class="card">
        <h2>Saldo disponível (kg) x Data</h2>
        <div id="chartGeralLinha" class="chart-tall"></div>
      </div>
      <div class="card">
        <h2>Saldo por Setor (kg)</h2>
        <div id="chartGeralSetor" class="chart-tall"></div>
      </div>
    </div>
  </section>

  <!-- ===================== PÁGINA 2: FAMÍLIA / SKU ===================== -->
  <section class="page" id="page-familia">
    <div class="card filters">
      <div class="filter-group">
        <label for="familiaSetor">Setor</label>
        <select id="familiaSetor"></select>
      </div>
      <div class="filter-group">
        <label for="familiaPeriodo">Período</label>
        <select id="familiaPeriodo">
          <option value="7">Última semana</option>
          <option value="30">Último mês</option>
          <option value="all" selected>Tudo</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2 id="familiaLinhaTitle">Saldo disponível (kg) x Data</h2>
      <div id="chartFamiliaLinha" class="chart-tall"></div>
    </div>

    <div class="card">
      <h2 id="familiaWaterfallTitle">Saldo disponível (kg) x SKU</h2>
      <div id="chartFamiliaWaterfall" class="chart-tall"></div>
    </div>
  </section>

  <!-- ===================== PÁGINA 3: LOTES E VALIDADE ===================== -->
  <section class="page" id="page-lotes">
    <div class="card filters">
      <div class="filter-group">
        <label for="lotesSetor">Setor</label>
        <div class="multiselect" id="lotesSetor"></div>
      </div>
      <div class="filter-group">
        <label for="lotesProduto">Produto</label>
        <select id="lotesProduto"></select>
      </div>
      <div class="filter-group">
        <label for="lotesData">Leitura (data)</label>
        <select id="lotesData"></select>
      </div>
    </div>

    <div class="stat-row" id="lotesStatRow"></div>

    <div class="card">
      <h2>Informações de produtos fabricados</h2>
      <div class="table-scroll" id="tabelaTodos"></div>
    </div>

    <div class="card">
      <h2>Produtos com menos de 50% de validade</h2>
      <div class="table-scroll" id="tabelaAtencao"></div>
    </div>

    <div class="card">
      <h2>Produtos vencidos — retirar do estoque</h2>
      <div class="table-scroll" id="tabelaVencidos"></div>
    </div>
  </section>

  <div class="footer-note">Fonte: BD_006.xlsx — Depósito 006</div>
</div>

<script>
const DATA = __DASHBOARD_DATA__;
const THEME = __THEME_DATA__;

document.getElementById('geradoEm').textContent = 'Atualizado em ' + DATA.gerado_em;

function resolveVar(name) {
  return getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(name).trim();
}
const seriesVars = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
function seriesColor(i) { return resolveVar(seriesVars[i % seriesVars.length]); }

function formatNum(n) {
  if (n === null || n === undefined) return '-';
  return n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}
function formatMil(n) {
  if (n === null || n === undefined) return '-';
  return (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' Mil';
}

// ---------------------------------------------------------------
// Navegação entre páginas
// ---------------------------------------------------------------
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'geral') Plotly.Plots.resize('chartGeralLinha'), Plotly.Plots.resize('chartGeralSetor');
    if (btn.dataset.page === 'familia') Plotly.Plots.resize('chartFamiliaLinha'), Plotly.Plots.resize('chartFamiliaWaterfall');
  });
});

function fatiaPeriodo(arr, periodo) {
  if (periodo === 'all') return arr;
  return arr.slice(-parseInt(periodo, 10));
}

// ---------------------------------------------------------------
// Componente: multi-seleção com checkboxes
// ---------------------------------------------------------------
function createMultiSelect(containerId, options, allSelectedByDefault) {
  const container = document.getElementById(containerId);
  let selected = new Set(allSelectedByDefault ? options : []);
  let onChangeCb = null;

  function label() {
    if (selected.size === 0) return 'Nenhum selecionado';
    if (selected.size === options.length) return 'Todos';
    if (selected.size <= 2) return [...selected].join(', ');
    return `${selected.size} selecionados`;
  }

  function render() {
    container.innerHTML = `
      <button type="button" class="multiselect-btn"><span class="ms-label">${label()}</span></button>
      <div class="multiselect-panel">
        <div class="multiselect-action" data-action="all">Selecionar todos</div>
        <div class="multiselect-action" data-action="none">Limpar seleção</div>
        <div class="multiselect-divider"></div>
        ${options.map(o => `
          <label class="multiselect-option">
            <input type="checkbox" value="${o}" ${selected.has(o) ? 'checked' : ''}>
            <span>${o}</span>
          </label>`).join('')}
      </div>`;

    container.querySelector('.multiselect-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.multiselect.open').forEach(el => {
        if (el !== container) el.classList.remove('open');
      });
      container.classList.toggle('open');
    });
    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) selected.add(cb.value); else selected.delete(cb.value);
        container.querySelector('.ms-label').textContent = label();
        if (onChangeCb) onChangeCb();
      });
    });
    container.querySelector('[data-action="all"]').addEventListener('click', () => {
      selected = new Set(options);
      render();
      if (onChangeCb) onChangeCb();
    });
    container.querySelector('[data-action="none"]').addEventListener('click', () => {
      selected = new Set();
      render();
      if (onChangeCb) onChangeCb();
    });
  }

  render();

  return {
    getSelected: () => selected,
    onChange: (cb) => { onChangeCb = cb; },
  };
}

document.addEventListener('click', () => {
  document.querySelectorAll('.multiselect.open').forEach(el => el.classList.remove('open'));
});

// =================================================================
// PÁGINA 1 — VISÃO GERAL
// =================================================================
function renderGeral() {
  const periodo = document.getElementById('geralPeriodo').value;
  const datas = fatiaPeriodo(DATA.evolucao_geral.datas, periodo);
  const totalKg = fatiaPeriodo(DATA.evolucao_geral.total_kg, periodo);

  const atual = totalKg[totalKg.length - 1];
  const anterior = totalKg.length > 1 ? totalKg[totalKg.length - 2] : null;
  const diff = anterior !== null ? atual - anterior : null;
  const pct = anterior ? (diff / anterior) * 100 : null;

  const statRow = document.getElementById('geralStatRow');
  statRow.innerHTML = `
    <div class="stat-tile">
      <div class="label">Saldo Atual (kg)</div>
      <div class="value">${formatMil(atual)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Variação % (kg)</div>
      <div class="value" style="font-size:22px">${pct !== null ? pct.toFixed(1) + '%' : '-'}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Diferença diária (kg)</div>
      <div class="value" style="font-size:22px">${diff !== null ? formatMil(diff) : '-'}</div>
    </div>`;

  const traceLinha = {
    x: datas, y: totalKg,
    type: 'scatter', mode: 'lines+markers+text',
    line: { color: resolveVar('--brand'), width: 2 },
    marker: { size: 7, color: resolveVar('--brand') },
    text: totalKg.map(formatMil), textposition: 'top center',
    textfont: { size: 10, color: resolveVar('--text-secondary') },
    hovertemplate: '%{x}<br>%{y:,.0f} kg<extra></extra>',
  };
  Plotly.newPlot('chartGeralLinha', [traceLinha], baseLayout(), { displayModeBar: false, responsive: true });

  // Saldo por Setor — barras horizontais, última data do período
  const setores = Object.keys(DATA.evolucao_geral.por_setor)
    .map(s => ({ setor: s, valor: DATA.evolucao_geral.por_setor[s][DATA.evolucao_geral.datas.length - 1] }))
    .sort((a, b) => b.valor - a.valor);

  const traceSetor = {
    x: setores.map(s => s.valor),
    y: setores.map(s => s.setor),
    type: 'bar', orientation: 'h',
    marker: { color: resolveVar('--brand') },
    text: setores.map(s => formatMil(s.valor)),
    textposition: 'outside',
    hovertemplate: '%{y}: %{x:,.0f} kg<extra></extra>',
  };
  const layoutSetor = baseLayout();
  layoutSetor.yaxis.autorange = 'reversed';
  layoutSetor.margin.l = 90;
  layoutSetor.margin.r = 70;
  const maxSetorValor = Math.max(...setores.map(s => s.valor), 0);
  layoutSetor.xaxis.range = [0, maxSetorValor * 1.18];
  Plotly.newPlot('chartGeralSetor', [traceSetor], layoutSetor, { displayModeBar: false, responsive: true });
}

function baseLayout() {
  return {
    margin: { l: 55, r: 20, t: 10, b: 40 },
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: { family: '"Segoe UI", sans-serif', color: resolveVar('--text-secondary'), size: 12 },
    xaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') } },
    yaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') }, rangemode: 'tozero' },
    showlegend: false,
  };
}

document.getElementById('geralPeriodo').addEventListener('change', renderGeral);

// =================================================================
// PÁGINA 2 — FAMÍLIA / SKU
// =================================================================
const setorSelect = document.getElementById('familiaSetor');
const setoresDisponiveis = Object.keys(DATA.evolucao_sku.por_setor_sku).sort();
setorSelect.innerHTML = setoresDisponiveis.map(s => `<option value="${s}">${s}</option>`).join('');

function renderFamilia() {
  const setor = setorSelect.value;
  const periodo = document.getElementById('familiaPeriodo').value;
  const datas = fatiaPeriodo(DATA.evolucao_sku.datas, periodo);

  document.getElementById('familiaLinhaTitle').textContent = `Saldo disponível (kg) x Data — ${setor}`;
  document.getElementById('familiaWaterfallTitle').textContent = `Saldo disponível (kg) x SKU — ${setor}`;

  const skuMap = DATA.evolucao_sku.por_setor_sku[setor] || {};
  const totalPorDia = datas.map((_, i) => {
    const idxOffset = DATA.evolucao_sku.datas.length - datas.length;
    return Object.values(skuMap).reduce((acc, serie) => acc + serie[i + idxOffset], 0);
  });

  const traceLinha = {
    x: datas, y: totalPorDia,
    type: 'scatter', mode: 'lines+markers+text',
    line: { color: resolveVar('--brand'), width: 2 },
    marker: { size: 7, color: resolveVar('--brand') },
    text: totalPorDia.map(formatMil), textposition: 'top center',
    textfont: { size: 10, color: resolveVar('--text-secondary') },
    hovertemplate: '%{x}<br>%{y:,.0f} kg<extra></extra>',
  };
  Plotly.newPlot('chartFamiliaLinha', [traceLinha], baseLayout(), { displayModeBar: false, responsive: true });

  // Waterfall por SKU, última data do período selecionado
  const idxUltima = DATA.evolucao_sku.datas.length - 1;
  const skus = Object.keys(skuMap)
    .map(sku => ({ sku, valor: skuMap[sku][idxUltima] }))
    .filter(s => s.valor > 0)
    .sort((a, b) => b.valor - a.valor);

  const total = skus.reduce((acc, s) => acc + s.valor, 0);

  const traceWaterfall = {
    type: 'waterfall',
    orientation: 'v',
    x: [...skus.map(s => s.sku), 'Total'],
    y: [...skus.map(s => s.valor), total],
    measure: [...skus.map(() => 'relative'), 'total'],
    text: [...skus.map(s => formatMil(s.valor)), formatMil(total)],
    textposition: 'outside',
    connector: { line: { color: resolveVar('--gridline') } },
    increasing: { marker: { color: resolveVar('--brand') } },
    totals: { marker: { color: resolveVar('--text-secondary') } },
    hovertemplate: '%{x}: %{y:,.0f} kg<extra></extra>',
  };
  const layoutWaterfall = baseLayout();
  layoutWaterfall.margin.b = 90;
  layoutWaterfall.xaxis.tickangle = -35;
  Plotly.newPlot('chartFamiliaWaterfall', [traceWaterfall], layoutWaterfall, { displayModeBar: false, responsive: true });
}

setorSelect.addEventListener('change', renderFamilia);
document.getElementById('familiaPeriodo').addEventListener('change', renderFamilia);

// =================================================================
// PÁGINA 3 — LOTES E VALIDADE
// =================================================================
const lotesSetorMultiselect = createMultiSelect('lotesSetor', DATA.filtros.setores, true);
const lotesProdutoSelect = document.getElementById('lotesProduto');
const lotesDataSelect = document.getElementById('lotesData');

lotesDataSelect.innerHTML = DATA.filtros.datas.map(d => `<option value="${d}">${d}</option>`).join('');
lotesDataSelect.value = DATA.filtros.datas[DATA.filtros.datas.length - 1];

function popularProdutosLotes() {
  const setoresSelecionados = lotesSetorMultiselect.getSelected();
  const produtos = DATA.filtros.produtos.filter(p => setoresSelecionados.has(p.setor));
  lotesProdutoSelect.innerHTML = '<option value="">Todos</option>' +
    produtos.map(p => `<option value="${p.codigo}">${p.nome}</option>`).join('');
}
popularProdutosLotes();
lotesSetorMultiselect.onChange(() => { popularProdutosLotes(); renderLotes(); });

function badgeValidade(pct, dias) {
  if (dias === null || dias === undefined) return '';
  if (dias < 0) return '<span class="badge critical">vencido</span>';
  if (pct !== null && pct < 15) return `<span class="badge critical">Vence em ${dias} dias</span>`;
  if (pct !== null && pct < 50) return `<span class="badge warning">Vence em ${dias} dias</span>`;
  return `<span class="badge good">Vence em ${dias} dias</span>`;
}

function montarTabela(linhas, incluirPctValidade) {
  if (linhas.length === 0) return '<div class="empty">Nenhum lote encontrado para o filtro selecionado.</div>';
  return `
    <table>
      <thead>
        <tr>
          <th>Lote</th>
          <th>Produto</th>
          <th>Fabricação</th>
          <th>Validade</th>
          <th class="num">Saldo (un)</th>
          <th class="num">Saldo (kg)</th>
          ${incluirPctValidade ? '<th class="num">% Validade Restante</th>' : ''}
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${linhas.map(l => `
          <tr>
            <td>${l.lote}</td>
            <td>${l.nome}</td>
            <td>${l.fabricacao || '-'}</td>
            <td>${l.validade || '-'}</td>
            <td class="num">${formatNum(l.saldo_un)}</td>
            <td class="num">${formatNum(l.saldo_kg)}</td>
            ${incluirPctValidade ? `<td class="num">${l.pct_validade !== null ? l.pct_validade.toFixed(2) + '%' : '-'}</td>` : ''}
            <td>${badgeValidade(l.pct_validade, l.dias_para_vencer)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderLotes() {
  const setoresSelecionados = lotesSetorMultiselect.getSelected();
  const produto = lotesProdutoSelect.value;
  const data = lotesDataSelect.value;

  const todos = (DATA.lotes_por_data[data] || []).filter(l =>
    setoresSelecionados.has(l.setor) && (!produto || l.produto === produto)
  );

  const saldoUnTotal = todos.reduce((acc, l) => acc + l.saldo_un, 0);
  const saldoKgTotal = todos.reduce((acc, l) => acc + l.saldo_kg, 0);

  const atencao = todos.filter(l => l.dias_para_vencer !== null && l.dias_para_vencer >= 0 && l.pct_validade !== null && l.pct_validade < 50)
    .sort((a, b) => a.dias_para_vencer - b.dias_para_vencer);
  const vencidos = todos.filter(l => l.dias_para_vencer !== null && l.dias_para_vencer < 0)
    .sort((a, b) => a.dias_para_vencer - b.dias_para_vencer);

  document.getElementById('lotesStatRow').innerHTML = `
    <div class="stat-tile">
      <div class="label">Saldo Atual (un)</div>
      <div class="value">${formatMil(saldoUnTotal)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Saldo Atual (kg)</div>
      <div class="value">${formatMil(saldoKgTotal)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Lotes em Atenção</div>
      <div class="value">${atencao.length}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Lotes Vencidos</div>
      <div class="value" style="color: var(--critical)">${vencidos.length}</div>
    </div>`;

  document.getElementById('tabelaTodos').innerHTML = montarTabela(
    todos.sort((a, b) => (a.dias_para_vencer ?? 9999) - (b.dias_para_vencer ?? 9999)), true
  );
  document.getElementById('tabelaAtencao').innerHTML = montarTabela(atencao, true);
  document.getElementById('tabelaVencidos').innerHTML = montarTabela(vencidos, true);
}

lotesProdutoSelect.addEventListener('change', renderLotes);
lotesDataSelect.addEventListener('change', renderLotes);

// ---------------------------------------------------------------
// Inicialização
// ---------------------------------------------------------------
renderGeral();
renderFamilia();
renderLotes();
</script>
</body>
</html>
