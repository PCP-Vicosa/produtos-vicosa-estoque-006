document.getElementById('geradoEm').textContent = 'Atualizado em ' + DATA.gerado_em;

const seriesColors = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)',
                       'var(--series-5)','var(--series-6)','var(--series-7)','var(--series-8)'];

function resolveVar(name) {
  return getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(name).trim();
}

// --- Monta listas de família / produto ---
const familias = [...new Set(DATA.resumo.map(r => r.familia))].sort();
const familiaSelect = document.getElementById('filtroFamilia');
familiaSelect.innerHTML = '<option value="">Todas</option>' +
  familias.map(f => `<option value="${f}">Família ${f}</option>`).join('');

const produtoSelect = document.getElementById('filtroProduto');

function produtosDaFamilia(familia) {
  return DATA.resumo
    .filter(r => !familia || r.familia === familia)
    .map(r => r.produto)
    .sort();
}

function popularProdutos(familia) {
  const produtos = produtosDaFamilia(familia);
  produtoSelect.innerHTML = produtos.map(p => `<option value="${p}">${p}</option>`).join('');
}

popularProdutos('');

familiaSelect.addEventListener('change', () => {
  popularProdutos(familiaSelect.value);
  render();
});
produtoSelect.addEventListener('change', render);
document.getElementById('filtroPeriodo').addEventListener('change', render);

function formatNum(n) {
  return n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

function statTile(label, value, deltaLabel, deltaClass) {
  return `
    <div class="stat-tile">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      ${deltaLabel ? `<div class="delta ${deltaClass}">${deltaLabel}</div>` : ''}
    </div>`;
}

function badgeParaValidade(dias) {
  if (dias === null || dias === undefined) return '';
  if (dias < 0) return '<span class="badge critical">vencido</span>';
  if (dias <= 7) return `<span class="badge critical">${dias} dia(s)</span>`;
  if (dias <= 20) return `<span class="badge warning">${dias} dias</span>`;
  return `<span class="badge good">${dias} dias</span>`;
}

function render() {
  const produto = produtoSelect.value;
  const periodo = document.getElementById('filtroPeriodo').value;

  // --- Stat row ---
  const info = DATA.resumo.find(r => r.produto === produto);
  const statRow = document.getElementById('statRow');
  if (!info) {
    statRow.innerHTML = '<div class="empty">Selecione um produto.</div>';
  } else {
    const delta = info.variacao;
    const deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
    const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '—';
    statRow.innerHTML =
      statTile('Saldo atual', formatNum(info.saldo_atual), null, '') +
      statTile('Saldo dia anterior', formatNum(info.saldo_anterior), null, '') +
      statTile('Variação (1 dia)', `${arrow} ${formatNum(Math.abs(delta))}`, null, deltaClass) +
      statTile('Família', 'Família ' + info.familia, null, '');
  }

  // --- Gráfico de evolução ---
  document.getElementById('chartTitle').textContent = produto
    ? `Evolução do saldo — ${produto}`
    : 'Evolução do saldo';

  let datas = DATA.evolucao.datas;
  let valores = produto ? (DATA.evolucao.series[produto] || datas.map(() => 0)) : [];

  if (periodo !== 'all') {
    const n = parseInt(periodo, 10);
    datas = datas.slice(-n);
    valores = valores.slice(-n);
  }

  const trace = {
    x: datas,
    y: valores,
    type: 'scatter',
    mode: 'lines+markers',
    line: { color: resolveVar('--series-1'), width: 2, shape: 'spline' },
    marker: { size: 8, color: resolveVar('--series-1') },
    fill: 'tozeroy',
    fillcolor: resolveVar('--series-1').replace(')', ', 0.08)').replace('rgb', 'rgba'),
    hovertemplate: '%{x}<br>Saldo: %{y:,.0f}<extra></extra>',
  };

  const layout = {
    margin: { l: 50, r: 20, t: 10, b: 40 },
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: resolveVar('--text-secondary'), size: 12 },
    xaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') } },
    yaxis: { gridcolor: resolveVar('--gridline'), linecolor: resolveVar('--baseline'), tickfont: { color: resolveVar('--text-muted') }, rangemode: 'tozero' },
    showlegend: false,
  };

  Plotly.newPlot('chart', produto ? [trace] : [], layout, { displayModeBar: false, responsive: true });

  // --- Tabela de lotes ---
  document.getElementById('lotesTitle').textContent =
    `Lotes em estoque — ${DATA.lotes.ultima_data}` + (produto ? ` — ${produto}` : '');

  const lotes = produto ? (DATA.lotes.lotes[produto] || []) : [];
  const tableDiv = document.getElementById('lotesTable');
  if (!produto) {
    tableDiv.innerHTML = '<div class="empty">Selecione um produto para ver os lotes.</div>';
  } else if (lotes.length === 0) {
    tableDiv.innerHTML = '<div class="empty">Sem saldo em estoque na última leitura.</div>';
  } else {
    tableDiv.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Lote</th>
            <th>Fabricação</th>
            <th>Validade</th>
            <th class="num">Saldo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${lotes.map(l => `
            <tr>
              <td>${l.lote}</td>
              <td>${l.fabricacao}</td>
              <td>${l.validade}</td>
              <td class="num">${formatNum(l.saldo)}</td>
              <td>${badgeParaValidade(l.dias_para_vencer)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
}

// Seleciona o primeiro produto por padrão
if (produtoSelect.options.length > 0) {
  produtoSelect.selectedIndex = 0;
}
render();
</script>
